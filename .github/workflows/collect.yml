name: Public 4h spot candles (manual research)

on:
  workflow_dispatch:
    inputs:
      start:
        description: UTC 4h-boundary start (inclusive)
        required: true
        default: '2024-01-01T00:00:00Z'
        type: string
      end:
        description: UTC 4h-boundary end (exclusive)
        required: true
        default: '2024-01-09T00:00:00Z'
        type: string

permissions:
  contents: read

concurrency:
  group: ryze-public-spot-ohlcv
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest -q test_collector
      - name: Collect Coinbase public candles for specified closed interval
        env:
          START_UTC: ${{ inputs.start }}
          END_UTC: ${{ inputs.end }}
        run: python collector.py --provider coinbase --start "$START_UTC" --end "$END_UTC" --output out
      - uses: actions/upload-artifact@v4
        with:
          name: public-spot-4h-sample
          path: out/*
          if-no-files-found: error
          retention-days: 1
